server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy calls to /api to the backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Sin estas directivas nginx corta a los 60 s por defecto y devuelve su página de
        # 504 en HTML, que es lo que acababa volcado en el panel de error del frontend.
        # 180 s da margen a las operaciones legítimamente lentas (escaneo de imágenes,
        # sincronización con NVD) sin dejar una petición colgada indefinidamente.
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        # Tamaño máximo del cuerpo de una petición, que en la práctica es el tope del
        # import de infraestructura. Sin esta directiva regía el valor por defecto de
        # nginx (1 MiB), que no lo había elegido nadie.
        #
        # nginx almacena el cuerpo en disco antes de pasarlo al backend, así que una
        # subida de este tamaño ocupa temporalmente ese espacio en el contenedor.
        client_max_body_size 1g;

        # Tiempo entre lecturas sucesivas del cuerpo, no duración total de la subida:
        # protege de clientes que se quedan a medias sin cortar subidas largas legítimas.
        client_body_timeout 300s;
    }
}
